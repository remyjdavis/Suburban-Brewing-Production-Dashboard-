<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Suburban Brewing Company – Production Dashboard</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    header {
      background: #1f3864;
      color: white;
      text-align: center;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header h2 {
      margin: 5px 0 0;
      font-weight: normal;
      font-size: 18px;
      opacity: 0.9;
    }

    main {
      padding: 20px;
    }

    section {
      margin-bottom: 40px;
    }

    section h2 {
      margin-bottom: 15px;
      border-bottom: 2px solid #ccc;
      padding-bottom: 5px;
    }

    .tank-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .tank {
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      transition: transform 0.2s ease;
    }

    .tank:hover {
      transform: translateY(-2px);
    }

    .tank h4 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .tank div {
      margin-bottom: 6px;
      font-size: 14px;
    }

    /* STATUS COLORS */
    .status-fermenting { border-left: 6px solid #f39c12; }
    .status-conditioning { border-left: 6px solid #8e44ad; }
    .status-ready { border-left: 6px solid #27ae60; }
    .status-cip { border-left: 6px solid #c0392b; }
    .status-empty { border-left: 6px solid #bdc3c7; }
  </style>
</head>

<body>

<header>
  <h1>Suburban Brewing Company</h1>
  <h2>Production Dashboard</h2>
</header>

<main>
  <section>
    <h2>Fermentation Tanks</h2>
    <div id="fermentation" class="tank-grid"></div>
  </section>

  <section>
    <h2>Brite Tanks</h2>
    <div id="brite" class="tank-grid"></div>
  </section>
</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const API_URL =
    "https://script.google.com/macros/s/AKfycbzB0d5yltjq5Y1kmk9jDmrgUpRw9NnozKctgh0ELGb6cde7I51xqbcXDoUBbPDjygI5/exec?action=tanks";

  fetch(API_URL)
    .then(res => res.json())
    .then(json => {
      console.log("RAW RESPONSE:", json);
      const tanks = Array.isArray(json) ? json : json.data;
      renderTanks(tanks);
    })
    .catch(err => console.error("FETCH ERROR:", err));
});

function renderTanks(tanks) {
  const ferm = document.getElementById("fermentation");
  const brite = document.getElementById("brite");

  ferm.innerHTML = "";
  brite.innerHTML = "";

  tanks.forEach(t => {
    const status = (t.Status || "empty").toLowerCase();

    const card = document.createElement("div");
    card.className = `tank status-${status}`;

    card.innerHTML = `
      <h4>${t.TankID}</h4>
      <div><strong>Batch:</strong> ${t.Batch || "—"}</div>
      <div><strong>Day:</strong> ${t.Day || "—"}</div>
      <div><strong>Status:</strong> ${t.Status || "—"}</div>
    `;

    if (t.Type === "Fermenter") ferm.appendChild(card);
    if (t.Type === "Brite") brite.appendChild(card);
  });
}
</script>

</body>
</html>
