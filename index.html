<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Suburban Brewing Company – Production Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Suburban Brewing Company</h1>
  <div class="subtitle">Production Dashboard</div>

  <h2>Fermentation Tanks</h2>
  <div class="grid" id="fermenters"></div>

  <h2>Brite / Other Tanks</h2>
  <div class="grid" id="brites"></div>

  <!-- FERMENTATION MODAL -->
  <div id="fermModal" class="ferm-modal hidden">
    <div class="ferm-window">
      <button class="ferm-close">&times;</button>

      <h2 id="fermTitle">Fermentation</h2>

      <canvas id="fermChart" height="120"></canvas>

      <div id="fermCards"></div>

      <button id="addFermReading" class="primary">
        + Add Daily Reading
      </button>
    </div>
  </div>

  <script src="chart.js"></script>
  <script src="dashboard.js"></script>

</body>
</html>
