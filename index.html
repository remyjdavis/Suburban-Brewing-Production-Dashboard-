<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Suburban Brewing – Production Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="app-header">
    <div class="header-content">
      <h1>Suburban Brewing Company</h1>
      <h2>Production Dashboard</h2>
    </div>
  </header>

  <main class="dashboard">

    <section class="dashboard-section">
      <h3 class="section-title">Fermentation Tanks</h3>
      <div id="fermentation" class="tank-grid"></div>
    </section>

    <section class="dashboard-section">
      <h3 class="section-title">Brite Tanks</h3>
      <div id="brite" class="tank-grid"></div>
    </section>

  </main>

  <script src="dashboard.js"></script>
</body>
</html>
