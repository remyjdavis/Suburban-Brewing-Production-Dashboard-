<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Suburban Brewing Company – Production Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
  <h1>Suburban Brewing Company</h1>
  <h2>Production Dashboard</h2>
</header>

<section>
  <h3>Fermentation Tanks</h3>
  <div id="fermentation" class="tank-grid"></div>
</section>

<section>
  <h3>Brite Tanks</h3>
  <div id="brite" class="tank-grid"></div>
</section>

<section>
  <h3>Production Timeline</h3>
  <div id="timeline"></div>
</section>

<!-- Brew Log Modal -->
<section id="brew-log-modal" class="modal hidden">
  <div class="modal-content">
    <span id="close-log" class="close">&times;</span>
    <h3 id="log-title"></h3>

    <form id="log-form">
      <label>Date</label>
      <input type="date" id="log-date" required>

      <label>Stage / Action</label>
      <input type="text" id="log-stage" required>

      <label>Notes</label>
      <textarea id="log-notes"></textarea>

      <button type="submit">Add Log Entry</button>
    </form>

    <hr>

    <div id="brew-log-entries"></div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
