<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fermentation Log</title>
  <link rel="stylesheet" href="fermentation.css" />
</head>
<body>

<h2 id="title">Fermentation Log</h2>

<table id="fermTable">
  <thead>
    <tr>
      <th>Day</th>
      <th>Temp</th>
      <th>Gravity</th>
      <th>pH</th>
      <th>Pressure</th>
      <th>Notes</th>
    </tr>
  </thead>
  <tbody id="fermentationTable"></tbody>
</table>

<h3>Add Daily Reading</h3>

<div class="form">
  <input id="temp" placeholder="Temp" />
  <input id="gravity" placeholder="Gravity" />
  <input id="ph" placeholder="pH" />
  <input id="pressure" placeholder="Pressure" />
  <input id="notes" placeholder="Notes" />
  <button id="saveFermentation">Save</button>
</div>

<button onclick="window.location.href='dashboard.html'">
  Back to Dashboard
</button>

<script src="fermentation.js"></script>
</body>
</html>
