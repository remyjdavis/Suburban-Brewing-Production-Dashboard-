<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brew Log</title>
  <link rel="stylesheet" href="brew-log.css">
</head>

<body>

<header class="brew-header">
  <input type="date">
  <select id="tank"></select>
  <select id="recipe"></select>
  <input placeholder="Brewer">
</header>

<div class="brew-log">

  <!-- YOUR EXISTING CARDS STAY AS-IS -->
  <div class="card">
    <h3>Recipe Targets</h3>
  </div>

  <div class="card">
    <h3>Grain Bill</h3>
    <table>
      <thead>
        <tr><th>Grain</th><th>Target</th><th>Milled</th></tr>
      </thead>
      <tbody id="grainTable"></tbody>
    </table>
  </div>

  <div class="card">
    <h3>Mash Schedule</h3>
    <table>
      <thead>
        <tr>
          <th>Step</th><th>Temp</th><th>Min</th>
          <th>pH</th><th>Start</th><th>End</th>
        </tr>
      </thead>
      <tbody id="mashTable"></tbody>
    </table>
  </div>

  <!-- continue existing cards exactly as you had them -->

</div>

<footer class="brew-footer">
  <button id="printBrewLog">Print Brew Log</button>
  <button id="saveBrewLog">Save Brew Log</button>
</footer>

<script src="brew-log.js"></script>
</body>
</html>
