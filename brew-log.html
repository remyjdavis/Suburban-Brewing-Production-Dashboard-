<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brew Log – Production</title>
  <link rel="stylesheet" href="brew-log.css">
</head>

<body>

<header class="page-header">
  <div class="header-grid">
    <div>
      <label>Date</label>
      <input type="date" id="date">
    </div>
    <div>
      <label>Tank</label>
      <input id="tank" readonly>
    </div>
    <div>
      <label>Recipe</label>
      <select id="recipe"></select>
    </div>
    <div>
      <label>Brewer</label>
      <input id="brewer" placeholder="Name">
    </div>
  </div>
</header>

<main class="grid">

  <!-- Recipe Targets -->
  <section class="card">
    <h3>Recipe Targets</h3>
    <div class="two-col">
      <div><label>Efficiency %</label><input id="efficiency"></div>
      <div><label>Target OG</label><input id="targetOG" readonly></div>
      <div><label>Target FG</label><input id="targetFG" readonly></div>
      <div><label>Volume</label><input id="targetVolume" readonly></div>
      <div><label>IBU</label><input id="ibu" readonly></div>
      <div><label>SRM</label><input id="srm" readonly></div>
    </div>
  </section>

  <!-- Grain Bill -->
  <section class="card">
    <h3>Grain Bill</h3>
    <table id="grainTable">
      <thead>
        <tr>
          <th>Grain</th>
          <th>Target</th>
          <th>Milled</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Water -->
  <section class="card">
    <h3>Water Profile (ppm)</h3>
    <div class="two-col">
      <div><label>Ca</label><input id="Ca"></div>
      <div><label>Mg</label><input id="Mg"></div>
      <div><label>Na</label><input id="Na"></div>
      <div><label>SO₄</label><input id="SO4"></div>
      <div><label>Cl</label><input id="Cl"></div>
      <div><label>HCO₃</label><input id="HCO3"></div>
    </div>
  </section>

  <!-- Mash -->
  <section class="card">
    <h3>Mash Schedule</h3>
    <table id="mashTable">
      <thead>
        <tr>
          <th>Step</th>
          <th>Temp</th>
          <th>Time</th>
          <th>pH</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Lauter -->
  <section class="card">
    <h3>Lauter</h3>

    <div class="lauter-block">
      <h4>First Runnings</h4>
      <input type="time">
      <input type="time">
      <input placeholder="Gravity">
      <input placeholder="Volume">
      <input placeholder="Deep Cuts">
    </div>

    <div class="lauter-block">
      <h4>First Sparge</h4>
      <input type="time">
      <input type="time">
      <input placeholder="Volume">
      <input placeholder="Deep Cuts">
    </div>

    <div class="lauter-block">
      <h4>Second Sparge</h4>
      <input type="time">
      <input type="time">
      <input placeholder="Volume">
      <input placeholder="Deep Cuts">
    </div>

    <div class="lauter-block">
      <h4>Final Runnings</h4>
      <input type="time">
      <input type="time">
      <input placeholder="Gravity">
      <input placeholder="Volume">
    </div>
  </section>

  <!-- Boil -->
  <section class="card">
    <h3>Boil</h3>
    <div class="two-col">
      <div>
        <label>Start</label>
        <input type="time" id="boilStart" name="boilStart">
      </div>
      <div>
        <label>End</label>
        <input type="time" id="boilEnd" name="boilEnd">
      </div>
    </div>
  </section>

  <!-- Knockout -->
  <section class="card">
    <h3>Knockout</h3>
    <div class="two-col">
      <div><label>Volume</label><input id="koVolume"></div>
      <div><label>Gravity</label><input id="koGravity"></div>
      <div><label>pH</label><input id="koPH"></div>
    </div>
  </section>

</main>

<footer class="footer">
  <button>Save Brew Log</button>
</footer>

<script src="brew-log.js"></script>
</body>
</html>
