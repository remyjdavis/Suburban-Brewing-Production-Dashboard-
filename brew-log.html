<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Brew Log</title>
  <link rel="stylesheet" href="brew-log.css" />
</head>
<body>

<div class="container">

  <!-- TOP ROW -->
  <div class="top-row">
    <input type="date" id="date">
    <select id="tank"></select>
    <select id="recipe"></select>
    <input placeholder="Brewer">
  </div>

  <!-- ROW 1 -->
  <div class="grid-4">
    <div class="card">
      <h3>Recipe Targets</h3>
      <input id="eff" placeholder="Eff %">
      <input id="og" placeholder="OG">
      <input id="fg" placeholder="FG">
      <input id="vol" placeholder="Vol">
      <input id="ibu" placeholder="IBU">
      <input id="srm" placeholder="SRM">
    </div>

    <div class="card">
      <h3>Grain Bill</h3>
      <table>
        <thead>
          <tr><th>Grain</th><th>Target</th><th>Milled</th></tr>
        </thead>
        <tbody id="grainTable"></tbody>
      </table>
    </div>

    <div class="card">
      <h3>Water Profile (ppm)</h3>
      <input id="ca" placeholder="Ca">
      <input id="mg" placeholder="Mg">
      <input id="na" placeholder="Na">
      <input id="so4" placeholder="SO₄">
      <input id="cl" placeholder="Cl">
      <input id="hco3" placeholder="HCO₃">
    </div>

    <div class="card">
      <h3>Mash Schedule</h3>
      <table>
        <thead>
          <tr>
            <th>Step</th><th>Temp</th><th>Min</th><th>pH</th><th>Start</th><th>End</th>
          </tr>
        </thead>
        <tbody id="mashTable"></tbody>
      </table>
    </div>
  </div>

  <!-- LAUTER -->
  <div class="card">
    <h3>Lauter Tun</h3>
    <table class="lauter">
      <thead>
        <tr>
          <th></th><th>Start</th><th>End</th><th>Vol</th><th>Deep Cuts</th><th>Gravity</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>First Runnings</td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
        <tr><td>First Sparge</td><td><input></td><td><input></td><td><input></td><td><input></td><td></td></tr>
        <tr><td>Second Sparge</td><td><input></td><td><input></td><td><input></td><td></td><td></td></tr>
        <tr><td>Final Runnings</td><td><input></td><td><input></td><td><input></td><td></td><td><input></td></tr>
      </tbody>
    </table>
  </div>

  <!-- BOIL (FULL WIDTH) -->
  <div class="card full">
    <h3>Boil</h3>

    <div class="boil-grid">
      <input placeholder="Boil Start">
      <input placeholder="Boil End">
      <input placeholder="Pre-Boil Vol">
      <input placeholder="Post-Boil Vol">
      <input placeholder="Boil Gravity">
      <input placeholder="Trub Loss">
    </div>

    <h4>Hops / Additions</h4>
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Type</th>
          <th>Name</th>
          <th>Amount</th>
          <th>IBU</th>
        </tr>
      </thead>
      <tbody id="boilTable"></tbody>
    </table>

    <button id="addBoilRow">+ Add Addition</button>
  </div>

  <!-- KO + YEAST -->
  <div class="grid-2">
    <div class="card">
      <h3>Knockout</h3>
      <input placeholder="KO Volume">
      <input placeholder="KO Gravity">
      <input placeholder="KO Temp">
      <input placeholder="pH">
    </div>

    <div class="card">
      <h3>Yeast</h3>
      <input placeholder="Strain">
      <input placeholder="Pitch Rate">
      <input placeholder="Pitch Temp">
      <input placeholder="Generation">
      <input placeholder="Source">
    </div>
  </div>

  <button class="save">Save Brew Log</button>

</div>

<script src="brew-log.js"></script>
</body>
</html>
