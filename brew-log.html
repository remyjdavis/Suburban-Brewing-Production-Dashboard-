<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Brew Day Log</title>
  <link rel="stylesheet" href="brew-log.css">
</head>
<body>

<header class="page-header">
  <h1>Brew Day Log</h1>

  <div class="brew-meta">
    <input id="date" type="date">
    <input id="tank" readonly placeholder="Tank">
    <select id="recipe"></select>
    <input id="brewer" placeholder="Brewer">
  </div>
</header>

<section class="grid">

  <!-- TARGETS -->
  <div class="card">
    <h2>Recipe Targets</h2>
    <div class="inline-fields">
      <input id="targetEff" placeholder="Brewhouse Efficiency (%)" readonly>
      <input id="targetOG" placeholder="Target OG" readonly>
      <input id="targetFG" placeholder="Target FG" readonly>
      <input id="targetVol" placeholder="Target Volume" readonly>
      <input id="targetIBU" placeholder="IBUs" readonly>
      <input id="targetColor" placeholder="Color (SRM)" readonly>
    </div>
  </div>

  <!-- GRAIN BILL -->
  <div class="card">
    <h2>Grain Bill</h2>
    <table id="grainTable">
      <thead>
        <tr>
          <th>Grain</th>
          <th>Target</th>
          <th>Milled</th>
        </tr>
      </thead>
      <tbody id="grainBody"></tbody>
    </table>
  </div>

  <!-- WATER -->
  <div class="card">
    <h2>Water Profile</h2>
    <div class="inline-fields">
      <input id="ca" placeholder="Ca">
      <input id="mg" placeholder="Mg">
      <input id="na" placeholder="Na">
      <input id="so4" placeholder="SO₄">
      <input id="cl" placeholder="Cl">
      <input id="hco3" placeholder="HCO₃">
    </div>
  </div>

  <!-- MASH SCHEDULE -->
  <div class="card">
    <h2>Mash Schedule</h2>
    <table id="mashTable">
      <thead>
        <tr>
          <th>Step</th>
          <th>Temp</th>
          <th>Time (min)</th>
          <th>pH</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Strike</td>
          <td><input></td>
          <td><input></td>
          <td><input></td>
        </tr>
        <tr>
          <td>Saccharification</td>
          <td><input></td>
          <td><input></td>
          <td><input></td>
        </tr>
        <tr>
          <td>Mash Out</td>
          <td><input></td>
          <td><input></td>
          <td><input></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- LAUTER -->
  <div class="card">
    <h2>Lauter</h2>
    <input type="time" id="lauterStart">
    <input type="time" id="lauterEnd">
    <input id="lauterDuration" placeholder="Duration (min)" readonly>
    <input placeholder="First Runnings Gravity">
    <input placeholder="Final Runnings Gravity">
  </div>

  <!-- BOIL -->
  <div class="card">
    <h2>Boil</h2>
    <input type="time" id="boilStart">
    <input type="time" id="boilEnd">
    <input id="boilDuration" placeholder="Duration (min)" readonly>

    <table id="hopTable">
      <thead>
        <tr>
          <th>Addition</th>
          <th>Amount</th>
          <th>Time (min)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- KNOCKOUT -->
  <div class="card">
    <h2>Knockout</h2>
    <input placeholder="KO Volume">
    <input placeholder="KO Gravity">
    <input placeholder="KO pH">
  </div>

</section>

<footer class="footer">
  <button class="save" onclick="saveBrew()">Save Brew Log</button>
</footer>

<script src="brew-log.js"></script>
</body>
</html>
