<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brew Log – Production</title>
  <link rel="stylesheet" href="brew-log.css">
</head>

<body>

<header class="page-header">
  <div class="header-grid">
    <div>
      <label>Date</label>
      <input type="date" id="date">
    </div>
    <div>
      <label>Tank</label>
      <input id="tank" readonly>
    </div>
    <div>
      <label>Recipe</label>
      <select id="recipe"></select>
    </div>
    <div>
      <label>Brewer</label>
      <input id="brewer" placeholder="Name">
    </div>
  </div>
</header>

<main class="grid">

  <!-- Recipe Targets -->
  <section class="card">
    <h3>Recipe Targets</h3>
    <div class="two-col">
      <div><label>Efficiency %</label><input id="efficiency"></div>
      <div><label>Target OG</label><input id="targetOG" readonly></div>
      <div><label>Target FG</label><input id="targetFG" readonly></div>
      <div><label>Volume</label><input id="volume" readonly></div>
      <div><label>IBU</label><input id="ibu" readonly></div>
      <div><label>SRM</label><input id="srm" readonly></div>
    </div>
  </section>

  <!-- Grain Bill -->
  <section class="card">
    <h3>Grain Bill</h3>
    <table id="grainTable">
      <thead>
        <tr><th>Grain</th><th>Target</th><th>Milled</th></tr>
      </thead>
      <tbody>
        <tr><td colspan="3" class="muted">— No data loaded —</td></tr>
      </tbody>
    </table>
  </section>

  <!-- Water -->
  <section class="card">
    <h3>Water Profile (ppm)</h3>
    <div class="two-col">
      <div><label>Ca</label><input id="ca"></div>
      <div><label>Mg</label><input id="mg"></div>
      <div><label>Na</label><input id="na"></div>
      <div><label>SO₄</label><input id="so4"></div>
      <div><label>Cl</label><input id="cl"></div>
      <div><label>HCO₃</label><input id="hco3"></div>
    </div>
  </section>

  <!-- Mash -->
  <section class="card">
    <h3>Mash Schedule</h3>
    <table id="mashTable">
      <thead>
        <tr><th>Step</th><th>Temp</th><th>Time</th><th>pH</th></tr>
      </thead>
      <tbody>
        <tr><td colspan="4" class="muted">— No data loaded —</td></tr>
      </tbody>
    </table>
  </section>

  <!-- Lauter -->
  <section class="card">
    <h3>Lauter</h3>

    <div class="lauter-row">
      <strong>First Runnings</strong>
      <input type="time">
      <input type="time">
      <input placeholder="Gravity">
      <input placeholder="Volume">
      <input placeholder="Deep Cuts">
    </div>

    <div class="lauter-row">
      <strong>First Sparge</strong>
      <input type="time">
      <input type="time">
      <input placeholder="Volume">
      <input placeholder="Deep Cuts">
    </div>

    <div class="lauter-row">
      <strong>Second Sparge</strong>
      <input type="time">
      <input type="time">
      <input placeholder="Volume">
      <input placeholder="Deep Cuts">
    </div>

    <div class="lauter-row">
      <strong>Final Runnings</strong>
      <input type="time">
      <input type="time">
      <input placeholder="Gravity">
      <input placeholder="Volume">
    </div>
  </section>

  <!-- Boil -->
  <section class="card">
    <h3>Boil</h3>
    <div class="two-col">
      <div><label>Start</label><input type="time"></div>
      <div><label>End</label><input type="time"></div>
    </div>
  </section>

  <!-- Knockout -->
  <section class="card">
    <h3>Knockout</h3>
    <div class="two-col">
      <div><label>Volume</label><input></div>
      <div><label>Gravity</label><input></div>
      <div><label>pH</label><input></div>
    </div>
  </section>

</main>

<footer class="footer">
  <button id="save">Save Brew Log</button>
</footer>

<script src="brew-log.js"></script>
</body>
</html>
