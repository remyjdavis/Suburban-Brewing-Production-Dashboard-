<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brew Day Log</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="page-header">
  <h1>Brew Day Log</h1>

  <div class="brew-meta">
    <input id="tank" readonly>
    <select id="recipe"></select>
    <input id="brewer" placeholder="Brewer">
    <input id="date" type="date">
  </div>
</header>

<section class="grid">

  <div class="card">
    <h2>Grain Bill</h2>
    <table id="grain-table"></table>
  </div>

  <div class="card">
    <h2>Water Profile</h2>
    <div class="inline-fields">
      <input id="ca" placeholder="Ca">
      <input id="mg" placeholder="Mg">
      <input id="na" placeholder="Na">
      <input id="so4" placeholder="SO₄">
      <input id="cl" placeholder="Cl">
      <input id="hco3" placeholder="HCO₃">
    </div>
  </div>

  <div class="card">
    <h2>Mash</h2>
    <input id="mashPH" placeholder="Mash pH">
  </div>

  <div class="card">
    <h2>Lauter</h2>
    <input id="lauterStart" type="time">
    <input id="lauterEnd" type="time">
    <input id="lauterDuration" readonly placeholder="Duration (min)">
    <input id="firstRun" placeholder="First Runnings SG">
    <input id="finalRun" placeholder="Final Runnings SG">
  </div>

  <div class="card">
    <h2>Knockout</h2>
    <input id="koVol" placeholder="KO Volume">
    <input id="koSG" placeholder="KO Gravity">
    <input id="koPH" placeholder="KO pH">
    <input id="eff" readonly placeholder="Brewhouse Efficiency %">
  </div>

</section>

<div class="footer">
  <button class="save" onclick="saveBrew()">Save Brew Log</button>
</div>

<script src="script.js"></script>
</body>
</html>
