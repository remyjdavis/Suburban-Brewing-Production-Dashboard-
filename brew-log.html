<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Brew Log – Production</title>
  <link rel="stylesheet" href="brew-log.css" />
</head>

<body>

<header class="page-header">
  <div class="brew-meta">
    <input type="date" id="date" />
    <input id="tank" placeholder="Tank" />
    <select id="recipe"></select>
    <input id="brewer" placeholder="Brewer" />
  </div>
</header>

<main class="grid">

  <!-- Recipe Targets -->
  <div class="card">
    <h2>Recipe Targets</h2>
    <div class="inline-fields">
      <input placeholder="Efficiency %" id="efficiency">
      <input placeholder="Target OG" id="og">
      <input placeholder="Target FG" id="fg">
      <input placeholder="Volume" id="volume">
      <input placeholder="IBU" id="ibu">
      <input placeholder="SRM" id="srm">
    </div>
  </div>

  <!-- Grain Bill -->
  <div class="card">
    <h2>Grain Bill</h2>
    <table>
      <thead>
        <tr>
          <th>Grain</th>
          <th>Target</th>
          <th>Milled</th>
        </tr>
      </thead>
      <tbody id="grainTable"></tbody>
    </table>
  </div>

  <!-- Water Profile -->
  <div class="card">
    <h2>Water Profile (ppm)</h2>
    <div class="water-grid">
      <label>Ca <input id="Ca" type="number"></label>
      <label>Mg <input id="Mg" type="number"></label>
      <label>Na <input id="Na" type="number"></label>
      <label>SO₄ <input id="SO4" type="number"></label>
      <label>Cl <input id="Cl" type="number"></label>
      <label>HCO₃ <input id="HCO3" type="number"></label>
    </div>
  </div>

  <!-- Mash Schedule -->
  <div class="card">
    <h2>Mash Schedule</h2>
    <table class="mash-table">
      <thead>
        <tr>
          <th>Step</th>
          <th>Temp</th>
          <th>Time</th>
          <th>pH</th>
          <th>Start</th>
          <th>End</th>
        </tr>
      </thead>
      <tbody id="mashTable"></tbody>
    </table>
  </div>

</main>

<!-- FULL WIDTH LAUTER -->
<section class="full-width-wrapper">
  <div class="card">
    <h2>Lauter Tun</h2>

    <div class="lauter-grid header">
      <span></span>
      <span>Start</span>
      <span>End</span>
      <span>Volume</span>
      <span>Deep Cuts</span>
      <span>Gravity</span>
    </div>

    <div class="lauter-grid">
      <strong>First Runnings</strong>
      <input type="time">
      <input type="time">
      <input>
      <input>
      <input>
    </div>

    <div class="lauter-grid">
      <strong>First Sparge</strong>
      <input type="time">
      <input type="time">
      <input>
      <input>
      <span></span>
    </div>

    <div class="lauter-grid">
      <strong>Second Sparge</strong>
      <input type="time">
      <input type="time">
      <input>
      <input>
      <span></span>
    </div>

    <div class="lauter-grid">
      <strong>Final Runnings</strong>
      <input type="time">
      <input type="time">
      <input>
      <span></span>
      <input>
    </div>

  </div>
</section>

<main class="grid">

  <!-- Boil -->
  <div class="card">
    <h2>Boil</h2>
    <div class="inline-fields">
      <input type="time" id="boilStart">
      <input type="time" id="boilEnd">
    </div>
  </div>

  <!-- Knockout -->
  <div class="card">
    <h2>Knockout</h2>
    <div class="inline-fields">
      <input placeholder="Volume">
      <input placeholder="Gravity">
      <input placeholder="pH">
    </div>
  </div>

</main>

<footer class="footer">
  <button class="save">Save Brew Log</button>
</footer>

<script src="brew-log.js"></script>
</body>
</html>
