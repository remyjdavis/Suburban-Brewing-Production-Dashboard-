<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Brew Log</title>
  <link rel="stylesheet" href="brew-log.css">
</head>

<body>

<header class="page-header">
  <h1>Brew Day Log</h1>
</header>

<section class="grid">

  <div class="card wide" id="meta"></div>
  <div class="card" id="targets"></div>
  <div class="card" id="grain"></div>
  <div class="card" id="water"></div>
  <div class="card" id="mash"></div>
  <div class="card" id="hops"></div>
  <div class="card" id="lauter"></div>
  <div class="card" id="boil"></div>
  <div class="card" id="ko"></div>
  <div class="card" id="qa"></div>
  <div class="card wide" id="signoff"></div>

</section>

<footer class="footer">
  <button class="save" onclick="saveBrew()">SAVE BREW LOG</button>
</footer>

<script src="brew-log.js"></script>
</body>
</html>
