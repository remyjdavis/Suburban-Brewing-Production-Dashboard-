<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Brew Log – Production</title>
  <link rel="stylesheet" href="brew-log.css" />
</head>

<body>

<header class="page-header">
  <div class="brew-meta">
    <input type="date" id="date" />
    <input id="tank" readonly />
    <select id="recipe"></select>
    <input id="brewer" placeholder="Brewer" />
  </div>
</header>

<main class="grid">

  <div class="card">
    <h2>Recipe Targets</h2>
    <div class="inline-fields">
      <input id="efficiency" placeholder="Efficiency %">
      <input id="og" placeholder="Target OG">
      <input id="fg" placeholder="Target FG">
      <input id="volume" placeholder="Volume">
      <input id="ibu" placeholder="IBU">
      <input id="srm" placeholder="SRM">
    </div>
  </div>

  <div class="card">
    <h2>Grain Bill</h2>
    <table>
      <thead>
        <tr>
          <th>Grain</th>
          <th>Target</th>
          <th>Milled</th>
        </tr>
      </thead>
      <tbody id="grainTable"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Water Profile (ppm)</h2>
    <div class="inline-fields">
      <input id="Ca" placeholder="Ca">
      <input id="Mg" placeholder="Mg">
      <input id="Na" placeholder="Na">
      <input id="SO4" placeholder="SO₄">
      <input id="Cl" placeholder="Cl">
      <input id="HCO3" placeholder="HCO₃">
    </div>
  </div>

  <div class="card">
    <h2>Mash Schedule</h2>
    <table>
      <thead>
        <tr>
          <th>Step</th>
          <th>Temp</th>
          <th>Time</th>
          <th>pH</th>
          <th>Start</th>
          <th>End</th>
        </tr>
      </thead>
      <tbody id="mashTable"></tbody>
    </table>
  </div>

</main>

<!-- FULL WIDTH LAUTER -->
<section class="full-width-wrapper">
  <div class="card">
    <h2>Lauter Tun</h2>

    <div class="lauter-grid">
      <div class="lauter-row header">
        <span></span><span>Start</span><span>End</span>
        <span>Volume</span><span>Deep Cuts</span><span>Gravity</span>
      </div>

      <div class="lauter-row">
        <strong>First Runnings</strong>
        <input type="time">
        <input type="time">
        <input>
        <input>
        <input>
      </div>

      <div class="lauter-row">
        <strong>First Sparge</strong>
        <input type="time">
        <input type="time">
        <input>
        <input>
        <span></span>
      </div>

      <div class="lauter-row">
        <strong>Second Sparge</strong>
        <input type="time">
        <input type="time">
        <input>
        <input>
        <span></span>
      </div>

      <div class="lauter-row">
        <strong>Final Runnings</strong>
        <input type="time">
        <input type="time">
        <input>
        <span></span>
        <input>
      </div>
    </div>
  </div>
</section>

<main class="grid">

  <div class="card">
    <h2>Boil</h2>
    <div class="inline-fields">
      <input type="time" id="boilStart">
      <input type="time" id="boilEnd">
    </div>
  </div>

  <div class="card">
    <h2>Knockout</h2>
    <div class="inline-fields">
      <input placeholder="Volume">
      <input placeholder="Gravity">
      <input placeholder="pH">
    </div>
  </div>

</main>

<footer class="footer">
  <button class="save">Save Brew Log</button>
</footer>

<script src="brew-log.js"></script>
</body>
</html>
