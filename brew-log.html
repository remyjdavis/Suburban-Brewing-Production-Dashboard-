<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="brew-log.css">
</head>
<body>

<header>
  <input id="date" type="date">
  <input id="tank" readonly>
  <select id="recipe"></select>
  <input id="brewer">
</header>

<section class="grid">

<div class="card">
<h3>Recipe Targets</h3>
<input id="efficiency">
<input id="targetOG">
<input id="targetFG">
<input id="targetVolume">
<input id="ibu">
<input id="srm">
</div>

<div class="card">
<h3>Grain Bill</h3>
<table id="grainTable">
<thead><tr><th>Grain</th><th>Target</th><th>Milled</th></tr></thead>
<tbody></tbody>
</table>
</div>

<div class="card">
<h3>Water Profile</h3>
<input id="Ca"><input id="Mg"><input id="Na">
<input id="SO4"><input id="Cl"><input id="HCO3">
</div>

<div class="card">
<h3>Mash Schedule</h3>
<table id="mashTable">
<thead><tr><th>Step</th><th>Temp</th><th>Time</th><th>pH</th></tr></thead>
<tbody></tbody>
</table>
</div>

<div class="card">
<h3>Boil</h3>
<table id="hopTable">
<thead><tr><th>Hop</th><th>Amount</th><th>Time</th></tr></thead>
<tbody></tbody>
</table>
</div>

<div class="card">
<h3>Knockout</h3>
<input id="koVolume">
<input id="koGravity">
<input id="koPH">
</div>

</section>

<button>Save Brew Log</button>

<script src="brew-log.js"></script>
</body>
</html>
