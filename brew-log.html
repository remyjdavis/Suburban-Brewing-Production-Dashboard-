<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Brew Log – Production</title>
  <link rel="stylesheet" href="brew-log.css" />
</head>

<body>

<header class="page-header">
  <input type="date">
  <input id="tank" placeholder="FV">
  <select id="recipe"></select>
  <input placeholder="Brewer">
</header>

<!-- FIRST ROW -->
<section class="grid four">

  <div class="card small">
    <h3>Recipe Targets</h3>
    <div class="inline">
      <input class="sm" type="number" placeholder="Eff %">
      <input class="lg" placeholder="OG">
      <input class="lg" placeholder="FG">
      <input class="md" placeholder="Vol">
      <input class="xs" placeholder="IBU">
      <input class="xs" placeholder="SRM">
    </div>
  </div>

  <div class="card small">
    <h3>Grain Bill</h3>
    <table class="tight">
      <thead>
        <tr><th>Grain</th><th>Target</th><th>Milled</th></tr>
      </thead>
      <tbody id="grainTable"></tbody>
    </table>
  </div>

  <div class="card small">
    <h3>Water Profile (ppm)</h3>
    <div class="water-grid">
      <label><span>Ca</span><input class="xs"></label>
      <label><span>Mg</span><input class="xs"></label>
      <label><span>Na</span><input class="xs"></label>
      <label><span>SO₄</span><input class="xs"></label>
      <label><span>Cl</span><input class="xs"></label>
      <label><span>HCO₃</span><input class="xs"></label>
    </div>
  </div>

  <div class="card small">
    <h3>Mash Schedule</h3>
    <table class="tight">
      <thead>
        <tr>
          <th>Step</th>
          <th>Temp</th>
          <th>Min</th>
          <th>pH</th>
          <th>Start</th>
          <th>End</th>
        </tr>
      </thead>
      <tbody id="mashTable"></tbody>
    </table>
  </div>

</section>

<!-- LAUTER -->
<section class="card">
  <h3>Lauter Tun</h3>
  <table class="tight">
    <thead>
      <tr>
        <th></th>
        <th>Start</th>
        <th>End</th>
        <th>Vol</th>
        <th>Deep Cuts</th>
        <th>Gravity</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><strong>First Runnings</strong></td>
        <td><input class="md" type="time"></td>
        <td><input class="md" type="time"></td>
        <td><input class="lg"></td>
        <td><input class="sm"></td>
        <td><input class="lg"></td>
      </tr>
      <tr>
        <td><strong>First Sparge</strong></td>
        <td><input class="md" type="time"></td>
        <td><input class="md" type="time"></td>
        <td><input class="lg"></td>
        <td><input class="sm"></td>
        <td></td>
      </tr>
      <tr>
        <td><strong>Second Sparge</strong></td>
        <td><input class="md" type="time"></td>
        <td><input class="md" type="time"></td>
        <td><input class="lg"></td>
        <td><input class="sm"></td>
        <td></td>
      </tr>
      <tr>
        <td><strong>Final Runnings</strong></td>
        <td><input class="md" type="time"></td>
        <td><input class="md" type="time"></td>
        <td><input class="lg"></td>
        <td></td>
        <td><input class="lg"></td>
      </tr>
    </tbody>
  </table>
</section>

<!-- THIRD ROW -->
<section class="grid three">

  <div class="card">
    <h3>Boil</h3>
    <input class="lg" type="time">
    <input class="lg" type="time">
    <input class="md" placeholder="Pre-Boil Vol">
    <input class="md" placeholder="Post-Boil Vol">
    <input class="lg" placeholder="Boil Gravity">
    <input class="sm" placeholder="Trub Loss">
  </div>

  <div class="card">
    <h3>Knockout</h3>
    <input class="md" placeholder="KO Volume">
    <input class="lg" placeholder="KO Gravity">
    <input class="sm" placeholder="KO Temp">
    <input class="sm" placeholder="pH">
  </div>

  <div class="card">
    <h3>Yeast</h3>
    <input class="lg" placeholder="Strain">
    <input class="md" placeholder="Pitch Rate">
    <input class="sm" placeholder="Pitch Temp">
    <input class="xs" placeholder="Gen">
    <input class="md" placeholder="Source">
  </div>

</section>

<footer>
  <button>Save Brew Log</button>
</footer>

<script src="brew-log.js"></script>
</body>
</html>
