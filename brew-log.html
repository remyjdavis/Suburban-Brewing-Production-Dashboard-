<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Brew Day Log</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
<header>
  <h1>Brew Day Log</h1>
  <h2 id="tankTitle"></h2>
</header>

<section>
  <form id="brewForm">
    <label>Batch ID <input name="BatchID" required></label><br><br>
    <label>Beer <input name="Beer" required></label><br><br>
    <label>Brewer <input name="Brewer"></label><br><br>
    <label>Date <input type="date" name="Date"></label><br><br>

    <button type="submit">Save Brew Log</button>
  </form>
</section>

<script>
  const params = new URLSearchParams(window.location.search);
  const tank = params.get("tank");

  document.getElementById("tankTitle").innerText =
    tank ? `Tank: ${tank}` : "No tank selected";
</script>
</body>
</html>
