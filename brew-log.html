<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Brew Log – Production</title>
  <link rel="stylesheet" href="brew-log.css" />
</head>

<body>

<header class="header">
  <label>Date <input type="date" id="date"></label>
  <label>Tank <input id="tank" readonly></label>
  <label>Recipe <select id="recipe"></select></label>
  <label>Brewer <input id="brewer" placeholder="Name"></label>
</header>

<main class="grid">

  <!-- Recipe Targets -->
  <section class="card">
    <h3>Recipe Targets</h3>
    <div class="fields">
      <label>Efficiency % <input id="efficiency"></label>
      <label>Target OG <input id="targetOG" readonly></label>
      <label>Target FG <input id="targetFG" readonly></label>
      <label>Volume <input id="volume" readonly></label>
      <label>IBU <input id="ibu" readonly></label>
      <label>SRM <input id="srm" readonly></label>
    </div>
  </section>

  <!-- Grain Bill -->
  <section class="card">
    <h3>Grain Bill</h3>
    <table id="grainTable">
      <thead>
        <tr><th>Grain</th><th>Target</th><th>Milled</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Water -->
  <section class="card">
    <h3>Water Profile (ppm)</h3>
    <div class="fields">
      <label>Ca <input id="ca" readonly></label>
      <label>Mg <input id="mg" readonly></label>
      <label>Na <input id="na" readonly></label>
      <label>SO₄ <input id="so4" readonly></label>
      <label>Cl <input id="cl" readonly></label>
      <label>HCO₃ <input id="hco3" readonly></label>
    </div>
  </section>

  <!-- Mash -->
  <section class="card">
    <h3>Mash Schedule</h3>
    <table id="mashTable">
      <thead>
        <tr><th>Step</th><th>Temp</th><th>Time</th><th>pH</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Lauter -->
  <section class="card">
    <h3>Lauter</h3>

    <h4>First Runnings</h4>
    <div class="fields">
      <input type="time" placeholder="Start">
      <input type="time" placeholder="End">
      <input placeholder="Gravity">
      <input placeholder="Volume">
      <input placeholder="Deep Cuts">
    </div>

    <h4>First Sparge</h4>
    <div class="fields">
      <input type="time">
      <input type="time">
      <input placeholder="Volume">
      <input placeholder="Deep Cuts">
    </div>

    <h4>Second Sparge</h4>
    <div class="fields">
      <input type="time">
      <input type="time">
      <input placeholder="Volume">
      <input placeholder="Deep Cuts">
    </div>

    <h4>Final Runnings</h4>
    <div class="fields">
      <input type="time">
      <input type="time">
      <input placeholder="Gravity">
      <input placeholder="Volume">
    </div>
  </section>

  <!-- Boil -->
  <section class="card">
    <h3>Boil</h3>
    <div class="fields">
      <label>Start <input type="time"></label>
      <label>End <input type="time"></label>
    </div>

    <table id="hopTable">
      <thead>
        <tr><th>Hop</th><th>Amount</th><th>Time</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Knockout -->
  <section class="card">
    <h3>Knockout</h3>
    <div class="fields">
      <label>Volume <input></label>
      <label>Gravity <input></label>
      <label>pH <input></label>
    </div>
  </section>

</main>

<footer>
  <button id="save">Save Brew Log</button>
</footer>

<script src="brew-log.js"></script>
</body>
</html>
