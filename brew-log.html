<section class="grid">

  <!-- GRAIN BILL -->
  <div class="card">
    <h2>Grain Bill</h2>
    <table>
      <thead>
        <tr>
          <th>Grain</th>
          <th>Target</th>
          <th>Milled</th>
        </tr>
      </thead>
      <tbody id="grainBody"></tbody>
    </table>
  </div>

  <!-- WATER -->
  <div class="card">
    <h2>Water Profile</h2>
    <div class="water-grid">
      <input id="Ca" placeholder="Ca">
      <input id="Mg" placeholder="Mg">
      <input id="Na" placeholder="Na">
      <input id="SO4" placeholder="SO4">
      <input id="Cl" placeholder="Cl">
      <input id="HCO3" placeholder="HCO3">
    </div>
  </div>

  <!-- LAUTER -->
  <div class="card">
    <h2>Lauter</h2>
    <input type="time" id="lauterStart">
    <input type="time" id="lauterEnd">
    <input id="lauterDuration" readonly placeholder="Duration (min)">
    <input placeholder="First Runnings SG">
    <input placeholder="Final Runnings SG">
  </div>

  <!-- BOIL -->
  <div class="card">
    <h2>Boil</h2>
    <input type="time" id="boilStart">
    <input type="time" id="boilEnd">
    <input id="boilDuration" readonly placeholder="Duration (min)">
    <table>
      <thead>
        <tr>
          <th>Addition</th>
          <th>Amount</th>
          <th>Time (min)</th>
        </tr>
      </thead>
      <tbody id="hopBody"></tbody>
    </table>
  </div>

</section>
