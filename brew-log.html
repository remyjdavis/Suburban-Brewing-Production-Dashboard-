<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Brew Day Log</title>
  <link rel="stylesheet" href="brew-log.css">
</head>

<body>

<header class="page-header">
  <h1>Brew Day Log</h1>
</header>

<section class="grid">

  <div class="card wide">
    <h2>Brew Meta</h2>
    <input id="beer" placeholder="Beer">
    <input id="brewer" placeholder="Brewer">
    <input id="date" type="date">
    <input id="tank" disabled>
  </div>

  <div class="card">
    <h2>Targets & Results</h2>
    <input id="targetOG" placeholder="Target OG">
    <input id="actualOG" placeholder="Actual OG">
    <input id="targetVol" placeholder="Target Volume">
    <input id="actualVol" placeholder="Actual Volume">
    <input id="efficiency" placeholder="Brewhouse Efficiency %">
    <input id="yeast" placeholder="Yeast Strain">
    <input id="pitchRate" placeholder="Pitch Rate">
  </div>

  <div class="card">
    <h2>Grain Bill</h2>
    <!-- You can expand this to a table later -->
    <textarea id="grainBill" placeholder="Grain bill details"></textarea>
  </div>

  <div class="card">
    <h2>Water Profile</h2>
    <input id="ca" placeholder="Ca">
    <input id="mg" placeholder="Mg">
    <input id="na" placeholder="Na">
    <input id="so4" placeholder="SO₄">
    <input id="cl" placeholder="Cl">
    <input id="hco3" placeholder="HCO₃">
  </div>

  <div class="card">
    <h2>Mash Schedule</h2>
    <input id="mashPh" placeholder="Mash pH">
    <textarea id="mashNotes" placeholder="Mash notes"></textarea>
  </div>

  <div class="card">
    <h2>Hop Schedule</h2>
    <textarea id="hopSchedule" placeholder="Hop schedule"></textarea>
  </div>

  <div class="card">
    <h2>Lauter</h2>
    <input id="firstRun" placeholder="First Runnings Gravity">
    <input id="finalRun" placeholder="Final Runnings Gravity">
    <textarea id="lauterNotes"></textarea>
  </div>

  <div class="card">
    <h2>Boil</h2>
    <input id="preBoil" placeholder="Pre-Boil Gravity">
    <input id="postBoil" placeholder="Post-Boil Gravity">
    <textarea id="boilNotes"></textarea>
  </div>

  <div class="card">
    <h2>Knockout</h2>
    <input id="koTemp" placeholder="KO Temp">
    <input id="koPh" placeholder="KO pH">
    <textarea id="koNotes"></textarea>
  </div>

  <div class="card wide">
    <h2>Sign Off</h2>
    <input id="checkedBy" placeholder="Checked By">
  </div>

</section>

<footer class="footer">
  <button class="save" onclick="saveBrew()">SAVE BREW LOG</button>
</footer>

<script src="brew-log.js"></script>
</body>
</html>
