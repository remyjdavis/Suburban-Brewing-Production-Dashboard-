<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brew Day Log</title>
  <link rel="stylesheet" href="brew-log.css">
</head>

<body>

<div class="page-header">
  <h1>Brew Day Log</h1>

  <div class="brew-meta">
    <input id="date" type="date">
    <input id="tank" placeholder="Tank" readonly>
    <select id="recipe"></select>
    <input id="brewer" placeholder="Brewer">
  </div>
</div>

<div class="grid">

  <!-- GRAIN BILL -->
  <div class="card">
    <h2>Grain Bill</h2>
    <table id="grain-table">
      <tr>
        <th>Grain</th>
        <th>Target</th>
        <th>Milled</th>
      </tr>
    </table>
  </div>

  <!-- MASH -->
  <div class="card">
    <h2>Mash Schedule</h2>
    <input placeholder="Strike Temp">
    <input placeholder="Mash Temp">
    <input placeholder="Mash Time (min)">
    <input placeholder="Mash pH">
  </div>

  <!-- LAUTER -->
  <div class="card">
    <h2>Lauter</h2>
    <input type="time" placeholder="Start">
    <input type="time" placeholder="End">
    <input placeholder="First Runnings Gravity">
    <input placeholder="Final Runnings Gravity">
  </div>

  <!-- BOIL -->
  <div class="card">
    <h2>Boil</h2>
    <input type="time" placeholder="Boil Start">
    <input type="time" placeholder="Boil End">

    <table>
      <tr>
        <th>Addition</th>
        <th>Amount</th>
        <th>Time (min)</th>
      </tr>
      <tr>
        <td><input></td>
        <td><input></td>
        <td><input></td>
      </tr>
      <tr>
        <td><input></td>
        <td><input></td>
        <td><input></td>
      </tr>
    </table>
  </div>

  <!-- KNOCKOUT -->
  <div class="card">
    <h2>Knockout</h2>
    <input placeholder="KO Volume">
    <input placeholder="KO Gravity">
    <input placeholder="KO pH">
  </div>

</div>

<div class="footer">
  <button class="save">Save Brew Log</button>
</div>

<script src="script.js"></script>
</body>
</html>
