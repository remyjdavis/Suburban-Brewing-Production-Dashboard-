<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Brew Log – Production</title>
  <link rel="stylesheet" href="brew-log.css" />
</head>

<body>

<header class="app-header">
  <div class="header-group">
    <label><span>Date</span><input id="date" type="date" /></label>
    <label><span>Tank</span><input id="tank" readonly /></label>
    <label><span>Recipe</span><select id="recipe"></select></label>
    <label><span>Brewer</span><input id="brewer" placeholder="Name" /></label>
  </div>
</header>

<main class="grid">

  <!-- Recipe Targets -->
  <section class="card">
    <h3>Recipe Targets</h3>
    <div class="field-grid">
      <label><span>Efficiency %</span><input id="efficiency" /></label>
      <label><span>Target OG</span><input id="targetOG" /></label>
      <label><span>Target FG</span><input id="targetFG" /></label>
      <label><span>Volume</span><input id="targetVolume" /></label>
      <label><span>IBU</span><input id="ibu" /></label>
      <label><span>SRM</span><input id="srm" /></label>
    </div>
  </section>

  <!-- Grain Bill -->
  <section class="card">
    <h3>Grain Bill</h3>
    <table id="grainTable">
      <thead>
        <tr><th>Grain</th><th>Target</th><th>Milled</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Water -->
  <section class="card">
    <h3>Water Profile (ppm)</h3>
    <div class="field-grid">
      <label><span>Ca</span><input id="Ca" /></label>
      <label><span>Mg</span><input id="Mg" /></label>
      <label><span>Na</span><input id="Na" /></label>
      <label><span>SO₄</span><input id="SO4" /></label>
      <label><span>Cl</span><input id="Cl" /></label>
      <label><span>HCO₃</span><input id="HCO3" /></label>
    </div>
  </section>

  <!-- Mash -->
  <section class="card">
    <h3>Mash Schedule</h3>
    <table id="mashTable">
      <thead>
        <tr><th>Step</th><th>Temp</th><th>Time</th><th>pH</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Lauter -->
  <section class="card">
    <h3>Lauter</h3>

    <h4>First Runnings</h4>
    <div class="field-grid lauter">
      <label><span>Start</span><input type="time" /></label>
      <label><span>End</span><input type="time" /></label>
      <label><span>Gravity</span><input /></label>
      <label><span>Volume</span><input /></label>
      <label><span>Deep Cuts</span><input /></label>
    </div>

    <h4>First Sparge</h4>
    <div class="field-grid lauter">
      <label><span>Start</span><input type="time" /></label>
      <label><span>End</span><input type="time" /></label>
      <label><span>Volume</span><input /></label>
      <label><span>Deep Cuts</span><input /></label>
    </div>

    <h4>Second Sparge</h4>
    <div class="field-grid lauter">
      <label><span>Start</span><input type="time" /></label>
      <label><span>End</span><input type="time" /></label>
      <label><span>Volume</span><input /></label>
      <label><span>Deep Cuts</span><input /></label>
    </div>

    <h4>Final Runnings</h4>
    <div class="field-grid lauter">
      <label><span>Start</span><input type="time" /></label>
      <label><span>End</span><input type="time" /></label>
      <label><span>Gravity</span><input /></label>
      <label><span>Volume</span><input /></label>
    </div>
  </section>

  <!-- Boil -->
  <section class="card">
    <h3>Boil</h3>
    <div class="field-grid">
      <label><span>Start</span><input type="time" /></label>
      <label><span>End</span><input type="time" /></label>
    </div>

    <table id="hopTable">
      <thead>
        <tr><th>Hop</th><th>Amount</th><th>Time</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- Knockout -->
  <section class="card">
    <h3>Knockout</h3>
    <div class="field-grid">
      <label><span>Volume</span><input id="koVolume" /></label>
      <label><span>Gravity</span><input id="koGravity" /></label>
      <label><span>pH</span><input id="koPH" /></label>
    </div>
  </section>

</main>

<footer class="app-footer">
  <button class="primary">Save Brew Log</button>
</footer>

<script src="brew-log.js"></script>
</body>
</html>
