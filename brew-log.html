<!DOCTYPE html>
<html>
<head>
  <title>Brew Log</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Brew Log</h1>
  <nav>
    <a href="index.html">Dashboard</a>
  </nav>
</header>

<main>
  <form id="brewForm">
    <input type="date" name="BrewDate" required>
    <input type="text" name="Beer" placeholder="Beer Name" required>
    <input type="text" name="Brewer" placeholder="Brewer">
    <input type="text" name="Tank" placeholder="Tank (FV-1)">
    <select name="Stage">
      <option>Brew Day</option>
      <option>Fermenting</option>
      <option>Conditioning</option>
      <option>Packaged</option>
    </select>
    <textarea name="Notes" placeholder="Notes"></textarea>
    <button type="submit">Save Brew</button>
  </form>

  <h2>History</h2>
  <div id="history"></div>
</main>

<script src="brew-log.js"></script>
</body>
</html>
