<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Brew Log – Production</title>
  <link rel="stylesheet" href="brew-log.css" />
</head>

<body>

<header class="page-header">
  <div class="brew-meta">
    <input type="date" id="date" />
    <input id="tank" placeholder="Tank" />
    <select id="recipe"></select>
    <input id="brewer" placeholder="Brewer" />
  </div>
</header>

<main class="grid">

  <!-- Recipe Targets -->
  <div class="card">
    <h2>Recipe Targets</h2>
    <div class="inline-fields">
      <input placeholder="Efficiency %">
      <input placeholder="Target OG">
      <input placeholder="Target FG">
      <input placeholder="Volume">
      <input placeholder="IBU">
      <input placeholder="SRM">
    </div>
  </div>

  <!-- Grain Bill -->
  <div class="card">
    <h2>Grain Bill</h2>
    <table>
      <thead>
        <tr>
          <th>Grain</th>
          <th>Target</th>
          <th>Milled</th>
        </tr>
      </thead>
      <tbody id="grainTable"></tbody>
    </table>
  </div>

  <!-- Water Profile -->
  <div class="card compact">
    <h2>Water Profile (ppm)</h2>
    <div class="water-grid">
      <label>Ca <input type="number"></label>
      <label>Mg <input type="number"></label>
      <label>Na <input type="number"></label>
      <label>SO₄ <input type="number"></label>
      <label>Cl <input type="number"></label>
      <label>HCO₃ <input type="number"></label>
    </div>
  </div>

  <!-- Mash Schedule -->
  <div class="card mash-card">
    <h2>Mash Schedule</h2>

    <div class="mash-row">
      <div class="label">Mash In</div>
      <div>62°C</div>
      <input placeholder="pH">
      <input type="time">
      <input type="time">
    </div>

    <div class="mash-row">
      <div class="label">First Rest</div>
      <div>62°C / 60m</div>
      <span>—</span>
      <input type="time">
      <input type="time">
    </div>

    <div class="mash-row">
      <div class="label">Mash Out</div>
      <div>77°C / 1m</div>
      <input placeholder="pH">
      <input type="time">
      <input type="time">
    </div>
  </div>

</main>

<!-- Lauter Tun -->
<section class="full-width-wrapper">
  <div class="card">
    <h2>Lauter Tun</h2>

    <div class="lauter-header">
      <span></span>
      <span>Start</span>
      <span>End</span>
      <span>Volume</span>
      <span>Deep Cuts</span>
      <span>Gravity</span>
    </div>

    <div class="lauter-row">
      <strong>First Runnings</strong>
      <input type="time">
      <input type="time">
      <input>
      <input>
      <input>
    </div>

    <div class="lauter-row">
      <strong>First Sparge</strong>
      <input type="time">
      <input type="time">
      <input>
      <input>
      <span></span>
    </div>

    <div class="lauter-row">
      <strong>Second Sparge</strong>
      <input type="time">
      <input type="time">
      <input>
      <input>
      <span></span>
    </div>

    <div class="lauter-row">
      <strong>Final Runnings</strong>
      <input type="time">
      <input type="time">
      <input>
      <span></span>
      <input>
    </div>

  </div>
</section>

<footer class="footer">
  <button class="save">Save Brew Log</button>
</footer>

<script src="brew-log.js"></script>
</body>
</html>
