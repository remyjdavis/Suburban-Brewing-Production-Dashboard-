<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brew Day Log</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page-header">
  <h1>Brew Day Log</h1>
  <div class="brew-meta">
    <input id="date" type="date">
    <input id="tank" readonly>
    <select id="recipe"></select>
    <input id="brewer" placeholder="Brewer">
  </div>
</div>

<div class="grid">

  <!-- GRAIN BILL -->
  <div class="card">
    <h2>Grain Bill</h2>
    <table id="grainTable">
      <thead>
        <tr>
          <th>Grain</th>
          <th>Target</th>
          <th>Milled</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- WATER -->
  <div class="card">
    <h2>Water Profile</h2>
    <div class="inline-fields">
      <input id="ca" placeholder="Ca">
      <input id="mg" placeholder="Mg">
      <input id="na" placeholder="Na">
      <input id="so4" placeholder="SO4">
      <input id="cl" placeholder="Cl">
      <input id="hco3" placeholder="HCO3">
    </div>
  </div>

  <!-- LAUTER -->
  <div class="card">
    <h2>Lauter</h2>
    <input id="lauterStart" type="time">
    <input id="lauterEnd" type="time">
    <input id="lauterDuration" placeholder="Duration (min)" readonly>
    <input placeholder="First Runnings Gravity">
    <input placeholder="Final Runnings Gravity">
  </div>

  <!-- BOIL -->
  <div class="card">
    <h2>Boil</h2>
    <input id="boilStart" type="time">
    <input id="boilEnd" type="time">
    <input id="boilDuration" placeholder="Duration (min)" readonly>

    <table id="hopTable">
      <thead>
        <tr>
          <th>Addition</th>
          <th>Amount</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<div class="footer">
  <button class="save" onclick="saveBrew()">Save Brew Log</button>
</div>

<script src="script.js"></script>
</body>
</html>
